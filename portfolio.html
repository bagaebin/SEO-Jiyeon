<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>SEO Jiyeon — Portfolio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
<style>
  /* 포트폴리오용 — 연락처는 블러 처리한다. 글자 크기에 따라 함께 조절되도록 em */
  [data-slot="email"] .t,
  [data-slot="phone"] .t{
    filter:blur(.2em);
    user-select:none;-webkit-user-select:none;
  }
  [data-slot="email"],
  [data-slot="phone"] .act{cursor:default}
</style>
</head>
<body>

<!-- 뚫린 구멍으로만 보이는 층: 카메라 (못 쓸 때는 대체 이미지) -->
<div class="backdrop">
  <img id="fallback" src="assets/fallback.jpg" alt="">
  <video id="cam" playsinline muted autoplay></video>
</div>

<!-- 흰 종이. 구멍 둘레를 네 장의 판이 채운다 -->
<div id="sheet">
  <div class="panel" id="pn-top"></div>
  <div class="panel" id="pn-bottom"></div>
  <div class="panel" id="pn-left"></div>
  <div class="panel" id="pn-right"></div>
</div>

<main id="stage" aria-label="명함을 그릴 영역">
  <section id="card" aria-label="SEO Jiyeon 명함">

    <!-- 뚫려 나가는 조각 (빈 흰 면) -->
    <div id="flap"></div>

    <!-- 그려진 영역을 표시하는 안쪽 그림자 → 뚫린 뒤에는 구멍의 두께가 된다.
         조각 위, 텍스트 아래에 둔다(텍스트를 어둡게 덮지 않도록) -->
    <div id="rim"></div>

    <!-- 구멍 안에서만 드러나는 텍스트 -->
    <div class="content" id="content">
      <span class="f" data-slot="role"><span class="t">Director</span></span>
      <span class="f" data-slot="places"><span class="t">Busan, Paris</span></span>
      <span class="f" data-slot="name"><span class="t">SEO Jiyeon</span></span>
      <a class="f act" data-slot="email" href="#" draggable="false"><span class="t"></span></a>
      <span class="f" data-slot="phone"></span>
    </div>

  </section>
</main>

<script src="app.js?v=11"></script>
<script>
/* 포트폴리오 사본에는 실제 연락처를 담지 않는다.
   블러는 화면에만 걸리고 원문은 소스에 그대로 남으므로, 값 자체를 자리표시자로
   바꾸고 mailto:/tel: 링크도 떼어 둔다. 길이는 원본과 맞춰 조판이 같게 보인다. */
(() => {
  const mail = document.querySelector('[data-slot="email"]');
  mail.removeAttribute('href');
  const t = mail.querySelector('.t');
  const dummy = 'portfolio@example.com';
  const at = dummy.indexOf('@');
  t.replaceChildren(dummy.slice(0, at + 1),
                    document.createElement('wbr'),
                    dummy.slice(at + 1));

  const masked = ['+82 10 0000 0000', '+33 00 00 00 00 00'];
  document.querySelectorAll('[data-slot="phone"] .act').forEach((a, i) => {
    a.removeAttribute('href');
    a.querySelector('.t').textContent = masked[i] ?? '';
  });
})();
</script>
</body>
</html>
