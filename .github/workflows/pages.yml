name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/digital-business-card-webpage-w92uzg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 가 꺼져 있으면 여기서 켠다
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 정적 사이트라 빌드 단계가 없다. 저장소 루트를 그대로 올린다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
